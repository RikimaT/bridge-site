name: Deploy site to GitHub Pages

# bridge-app（非公開化予定の本体）から分離した公開サイト配信専用リポジトリ。
# 中身は bridge-app の公開ファイルの複製。ソースの正は bridge-app 側にあり、
# 変更時は bridge-app→bridge-site へ同期する（ルールは README.md 参照）。
#
# 2026-09-27 追加（予約記事の自動公開）: 毎朝7:40(JST)にも組み立て直し、予約記事のうち公開日が来たものを
# 自動で公開する（public-site/_scheduled/release.py）。このファイルの正は bridge-app の
# tools/sitegen/bridge-site-pages.yml。
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '40 22 * * *'   # 毎朝 7:40 JST（GitHubの schedule は1〜2時間遅れることがある）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # デプロイ・カーフュー（bridge-app と同じルール。2026-07-06 ブレーン会議決定）
  # 23時〜翌7時(JST)は本番反映を止める。翌朝7時15分に curfew-catchup.yml が自動再デプロイ。
  curfew:
    runs-on: ubuntu-latest
    steps:
      - name: 時間帯チェック（JST 23時〜7時は停止）
        run: |
          HOUR=$(TZ=Asia/Tokyo date +%-H)
          if [ "$HOUR" -ge 23 ] || [ "$HOUR" -lt 7 ]; then
            echo "::error::🌙 デプロイ・カーフュー発動中（現在 JST ${HOUR}時）。明朝7時15分に自動で再デプロイされます。"
            exit 1
          fi
          echo "☀️ JST ${HOUR}時 — 通常時間帯なのでデプロイを続行します"

  deploy:
    needs: curfew
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 公開サイトを組み立てる
        run: |
          mkdir -p _site
          # rikima81.com の公開ページ
          cp -r public-site/. _site/
          # フェーズ2（2026-07-08 切替）: CNAME を同梱して rikima81.com をこのリポジトリから配信する。
          # 前提: bridge-app の非公開化（Pages停止）でドメインが解放されていること。
          # プロンプトビデオメーカー /douga/
          mkdir -p _site/douga
          cp ai-video-maker/index.html _site/douga/index.html
          # 生徒管理アプリ /kanri/（noindex付き・bridge-app と同一挙動。PWA一式も配信）
          mkdir -p _site/kanri/data
          cp index.html app.js style.css manifest.webmanifest sw.js _site/kanri/
          cp -r icons _site/kanri/icons
          cp data/sales-history.json _site/kanri/data/
          # 金曜PR動画メーカー（PWA）
          mkdir -p _site/pr-video-maker
          cp -r pr-video-maker/. _site/pr-video-maker/
          # Pixi AI PC版（PWA）
          mkdir -p _site/pixi-ai
          cp -r pixi-ai/. _site/pixi-ai/
          # お米の在庫帳（PWA。データは端末内のみ・noindex。2026-09-30）
          mkdir -p _site/kome
          cp -r kome/. _site/kome/
      - name: 予約記事のうち公開日が来たものを組み込む（公開日前の記事は配信物から外す）
        run: |
          if [ -f _site/_scheduled/release.py ]; then
            python3 _site/_scheduled/release.py --site _site --urls-out released-urls.txt
          else
            echo "予約記事の仕組みなし（スキップ）"
            : > released-urls.txt
          fi
          # 念のため: 予約フォルダが配信物に残っていたら止める
          if [ -d _site/_scheduled ]; then echo "::error::_site/_scheduled が残っています"; exit 1; fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 新しく公開した記事を検索エンジンへ通知（IndexNow。Bing・Yandex等。失敗してもデプロイは成功扱い）
        continue-on-error: true
        run: |
          if [ ! -s released-urls.txt ]; then echo "今日公開した記事はありません"; exit 0; fi
          KEYFILE=$(ls public-site/*.txt | grep -E '/[0-9a-f]{32}\.txt$' | head -1)
          if [ -z "$KEYFILE" ]; then echo "IndexNow のキーファイルがありません"; exit 0; fi
          KEY=$(basename "$KEYFILE" .txt)
          URLS=$(python3 -c "import json,sys; print(json.dumps([l.strip() for l in open('released-urls.txt') if l.strip()]))")
          BODY="{\"host\":\"rikimat.github.io\",\"key\":\"$KEY\",\"keyLocation\":\"https://rikimat.github.io/bridge-site/$KEY.txt\",\"urlList\":$URLS}"
          echo "$BODY"
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
      - name: 計測の受け口（bridge-app の ?app=hit）が動いているかの確認（失敗してもデプロイは成功扱い）
        continue-on-error: true
        run: |
          curl -sSL --max-time 60 "https://script.google.com/macros/s/AKfycbzeKwDS0BohvVL03aSQbEDhPNh5E4aD-uP5k5ZdngJIkf6nCHwDnDhacDFLoFI386OD/exec?app=hit&t=ping" | head -c 300; echo
